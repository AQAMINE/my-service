server:
  port: 8081

spring:
  application:
    name: my-service

  # Configuration de la Datasource PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5435/myservicedb?currentSchema=public
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  # Configuration JPA / Hibernate
  # Flyway owns the schema — do not let Hibernate create/alter tables.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuration Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: true
    baseline-on-migrate: false
    out-of-order: false

  # Configuration Sécurité OAuth2 / Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/my-service-realm

keycloak:
  server-url: http://localhost:8085
  realm: my-service-realm
  client-id: my-service-backend
  client-secret: nBBDagDMZTnaCMXm1bK4WRnrYZYQf5jd
  username: admin
  password: admin

# Configuration gRPC Client
grpc:
  client:
    crypto-service:
      address: 'static://${GRPC_CLIENT_CRYPTO_HOST:localhost}:${GRPC_CLIENT_CRYPTO_PORT:50051}'
      negotiation-type: plaintext