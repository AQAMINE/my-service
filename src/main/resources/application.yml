server:
  port: 8081

spring:
  application:
    name: aegis-vault

  # Configuration de la Datasource PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/myservicedb?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configuration JPA / Hibernate
  # Flyway owns the schema — do not let Hibernate create/alter tables.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuration Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: true
    baseline-on-migrate: false
    out-of-order: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      username: ${SPRING_REDIS_USERNAME:default}
      password: ${SPRING_REDIS_PASSWORD}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 heure
      cache-null-values: false

  # Configuration Sécurité OAuth2 / Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8085/realms/my-service-realm}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8085}
  realm: ${KEYCLOAK_REALM:my-service-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:my-service-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  username: ${KEYCLOAK_ADMIN_USERNAME:}
  password: ${KEYCLOAK_ADMIN_PASSWORD:}

# Configuration gRPC Client
grpc:
  client:
    crypto-service:
      address: 'static://${GRPC_CLIENT_CRYPTO_HOST:localhost}:${GRPC_CLIENT_CRYPTO_PORT:50051}'
      negotiation-type: plaintext
